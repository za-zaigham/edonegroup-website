<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 1000" width="1750" height="1000">
  <defs>
    <linearGradient id="accentFade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <style>
      .display { font-family: 'Plus Jakarta Sans', 'Helvetica Neue', 'Inter', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; font-weight: 500; }
      .light   { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; font-weight: 400; }
      .micro   { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1750" height="1000" fill="#FAFAFA"/>

  <!-- corner decorative gradient block -->
  <path d="M1750,1000 L1750,540 L1090,1000 Z" fill="url(#accentFade)" opacity="0.92"/>
  <path d="M1750,1000 L1750,720 L1340,1000 Z" fill="#09090B" opacity="0.85"/>

  <!-- thin top brand bar -->
  <rect x="80" y="80" width="60" height="6" fill="#4F46E5"/>
  <text x="160" y="92" class="micro" font-size="22" fill="#52525B">EdOne Group · Education that opens worlds</text>

  <!-- wordmark -->
  <text x="80" y="240" class="display" font-size="150" fill="#09090B">EdOne</text>
  <text x="80" y="290" class="micro" font-size="24" fill="#4F46E5">Study Abroad Counselling</text>

  <!-- name block -->
  <text x="80" y="620" class="display" font-size="120" fill="#09090B">Hajra</text>
  <text x="80" y="680" class="body" font-size="34" fill="#3F3F46">Founder &amp; Director</text>

  <!-- British Council pill -->
  <g transform="translate(80, 720)">
    <rect x="0" y="0" width="540" height="60" rx="30" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
    <circle cx="34" cy="30" r="10" fill="#4F46E5"/>
    <text x="58" y="40" class="body" font-size="24" fill="#4338CA">British Council Certified Counsellor</text>
  </g>

  <!-- web url bottom-left -->
  <text x="80" y="930" class="micro" font-size="22" fill="#09090B">edonegroup.com</text>
</svg>
