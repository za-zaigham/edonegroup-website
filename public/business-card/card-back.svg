<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 1000" width="1750" height="1000">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <style>
      .display { font-family: 'Plus Jakarta Sans', 'Helvetica Neue', 'Inter', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
      .body    { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; font-weight: 500; }
      .light   { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; font-weight: 400; }
      .micro   { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1750" height="1000" fill="url(#darkGrad)"/>

  <!-- ambient blobs -->
  <circle cx="1600" cy="120" r="240" fill="#4F46E5" opacity="0.18"/>
  <circle cx="1700" cy="900" r="180" fill="#06B6D4" opacity="0.14"/>

  <!-- accent bar -->
  <rect x="0" y="0" width="14" height="1000" fill="url(#accent2)"/>

  <!-- wordmark -->
  <text x="100" y="160" class="display" font-size="78" fill="#FAFAFA">EdOne</text>
  <text x="100" y="200" class="micro" font-size="20" fill="#A1A1AA">Education that opens worlds</text>

  <!-- divider -->
  <line x1="100" y1="240" x2="320" y2="240" stroke="#4F46E5" stroke-width="3"/>

  <!-- contact rows -->
  <g class="body" font-size="32" fill="#FAFAFA">
    <!-- phone -->
    <g transform="translate(100, 360)">
      <rect width="56" height="56" rx="14" fill="#27272A"/>
      <path d="M22,18 L34,18 L38,28 L32,32 C34,38 38,42 44,44 L48,38 L58,42 L58,54 C58,56 56,58 54,58 C36,58 18,40 18,22 C18,20 20,18 22,18 Z" fill="#FAFAFA" transform="translate(-4,-4) scale(0.9)"/>
      <text x="84" y="38" class="body" font-size="32" fill="#FAFAFA">+44 7570 985500</text>
      <text x="84" y="72" class="micro" font-size="16" fill="#A1A1AA">Call · WhatsApp</text>
    </g>

    <!-- email -->
    <g transform="translate(100, 500)">
      <rect width="56" height="56" rx="14" fill="#27272A"/>
      <path d="M14,18 L42,18 C44,18 46,20 46,22 L46,42 C46,44 44,46 42,46 L14,46 C12,46 10,44 10,42 L10,22 C10,20 12,18 14,18 Z M14,22 L28,34 L42,22" fill="none" stroke="#FAFAFA" stroke-width="2.4" transform="translate(0,0)"/>
      <text x="84" y="38" class="body" font-size="32" fill="#FAFAFA">info@edonegroup.com</text>
      <text x="84" y="72" class="micro" font-size="16" fill="#A1A1AA">Email</text>
    </g>

    <!-- web -->
    <g transform="translate(100, 640)">
      <rect width="56" height="56" rx="14" fill="#27272A"/>
      <circle cx="28" cy="28" r="16" fill="none" stroke="#FAFAFA" stroke-width="2.4"/>
      <ellipse cx="28" cy="28" rx="8" ry="16" fill="none" stroke="#FAFAFA" stroke-width="2.4"/>
      <line x1="12" y1="28" x2="44" y2="28" stroke="#FAFAFA" stroke-width="2.4"/>
      <text x="84" y="38" class="body" font-size="32" fill="#FAFAFA">edonegroup.com</text>
      <text x="84" y="72" class="micro" font-size="16" fill="#A1A1AA">Web</text>
    </g>
  </g>

  <!-- legal footer -->
  <line x1="100" y1="850" x2="1650" y2="850" stroke="#27272A" stroke-width="1"/>
  <text x="100" y="900" class="light" font-size="22" fill="#A1A1AA">EDONE GROUP LTD · Company No. 17101141</text>
  <text x="100" y="934" class="light" font-size="22" fill="#71717A">163 Silverhill Drive, Newcastle upon Tyne, NE5 2JP · Registered in England &amp; Wales</text>
</svg>
